name: Validate Approved Email Access

on:
  push:
    branches: [main]
    paths:
      - app.py
      - email_access.py
      - tests/test_email_access.py
      - requirements.txt
      - .github/workflows/email-access-check.yml
  pull_request:
    paths:
      - app.py
      - email_access.py
      - tests/test_email_access.py
      - requirements.txt
      - .github/workflows/email-access-check.yml

jobs:
  email-auth-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal unit test dependencies
        run: python -m pip install pytest requests
      - name: Compile auth and app entrypoint
        run: python -m compileall -q email_access.py app.py tests/test_email_access.py
      - name: Test email allowlist and OTP safety
        run: python -m pytest -q tests/test_email_access.py
